# Copy this file outside the Git repository and replace all paths.
project_root: /path/to/private/benchmark_workspace

# Report metadata. Set expected_manual_regions to an integer for an explicit
# completeness check, or leave it null to infer the count from the manifest.
report_title: Spatial instance-segmentation benchmark
evaluation_design: held_out  # one of: in_sample, held_out, external
expected_manual_regions: null

# Physical scale and full-resolution image geometry.
pixel_size_um: 0.2125
full_shape_yx: [27299, 31317]
region_area_um2: 24299647.244375

# Instance matching and boundary evaluation.
thresholds: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
boundary_tolerances_um: [0.5, 1.0, 1.5, 2.0]
primary_boundary_tolerance_um: null
exclude_border_objects: true
minimum_gt_instances_after_border_filter: 5

# Error graph and uncertainty settings.
error_overlap_fraction: 0.25
error_overlap_sensitivity_fraction: 0.10
bootstrap_iterations: 2000
bootstrap_seed: 20260820
local_density_radius_um: 20.0

# Private inputs. These files are intentionally not included in the repository.
manual_label_dir: /path/to/private/manual_instance_masks
manual_crop_manifest: /path/to/private/crop_manifest.csv
manual_image_dir: /path/to/private/roi_images
medullary_geojson: /path/to/private/medullary_region.geojson
morphology_channel_dir: /path/to/private/morphology_channels
